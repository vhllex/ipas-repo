name: Sync All Releases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch YTKACE Release
        id: ytkace
        run: |
          JSON=$(curl -s https://api.github.com/repos/itzzace/ytkace/releases/latest)
          TAG=$(echo "$JSON" | jq -r '.tag_name')
          DATE=$(echo "$JSON" | jq -r '.published_at' | cut -d'T' -f1)
          URL=$(echo "$JSON" | jq -r '.assets[] | select(.name | endswith(".ipa")) | select(.name | contains("iOS16") | not) | .browser_download_url')
          SIZE=$(echo "$JSON" | jq -r '.assets[] | select(.name | endswith(".ipa")) | select(.name | contains("iOS16") | not) | .size')

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          echo "URL=$URL" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT

      - name: Fetch Official SpotC++ App Object
        run: |
          curl -s "https://spotc-repo.yodaluca.dev/AltStore%20Repo.json" | jq '.apps[0]' > spotc_app.json

      - name: Fetch NuvioMobile Release
        id: nuvio
        run: |
          JSON=$(curl -s https://api.github.com/repos/NuvioMedia/NuvioMobile/releases/latest)
          TAG=$(echo "$JSON" | jq -r '.tag_name' | sed 's/^v//')
          DATE=$(echo "$JSON" | jq -r '.published_at' | cut -d'T' -f1)
          URL=$(echo "$JSON" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .browser_download_url')
          SIZE=$(echo "$JSON" | jq -r '.assets[] | select(.name | endswith(".ipa")) | .size')

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          echo "URL=$URL" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT

      - name: Fetch Stremio
        id: stremio
        run: |
          JSON=$(curl -s https://dl.strem.io/apple/altstore/source.json)
          VER=$(echo "$JSON" | jq -r '.apps[0].version')
          BUILD=$(echo "$JSON" | jq -r '.apps[0].buildVersion')
          DATE=$(echo "$JSON" | jq -r '.apps[0].versionDate' | cut -d'T' -f1)
          SIZE=$(echo "$JSON" | jq -r '.apps[0].size // 45000000')
          
          # Construct download URL: https://dl.strem.io/apple/{version}b{buildVersion}/ios/stremio_iOS.ipa
          URL="https://dl.strem.io/apple/${VER}b${BUILD}/ios/stremio_iOS.ipa"

          echo "VER=$VER" >> $GITHUB_OUTPUT
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          echo "URL=$URL" >> $GITHUB_OUTPUT
          echo "SIZE=$SIZE" >> $GITHUB_OUTPUT

      - name: Update apps.json
        run: |
          # Index 0: YTKACE
          jq --arg y_ver "${{ steps.ytkace.outputs.TAG }}" \
             --arg y_date "${{ steps.ytkace.outputs.DATE }}" \
             --arg y_url "${{ steps.ytkace.outputs.URL }}" \
             --arg y_size "${{ steps.ytkace.outputs.SIZE }}" \
             '.apps[0].version = $y_ver | .apps[0].versionDate = $y_date | .apps[0].downloadURL = $y_url | .apps[0].size = ($y_size | tonumber)' \
             apps.json > apps.tmp.json && mv apps.tmp.json apps.json

          # Index 1: SpotC++
          jq --slurpfile spotc spotc_app.json '.apps[1] = $spotc[0]' apps.json > apps.tmp.json && mv apps.tmp.json apps.json
          rm spotc_app.json

          # Index 2: Nuvio
          jq --arg n_ver "${{ steps.nuvio.outputs.TAG }}" \
             --arg n_date "${{ steps.nuvio.outputs.DATE }}" \
             --arg n_url "${{ steps.nuvio.outputs.URL }}" \
             --arg n_size "${{ steps.nuvio.outputs.SIZE }}" \
             '.apps[2].version = $n_ver | .apps[2].versionDate = $n_date | .apps[2].downloadURL = $n_url | .apps[2].size = ($n_size | tonumber)' \
             apps.json > apps.tmp.json && mv apps.tmp.json apps.json

          # Index 3: Stremio
          jq --arg s_ver "${{ steps.stremio.outputs.VER }}" \
             --arg s_date "${{ steps.stremio.outputs.DATE }}" \
             --arg s_url "${{ steps.stremio.outputs.URL }}" \
             --arg s_size "${{ steps.stremio.outputs.SIZE }}" \
             '.apps[3].version = $s_ver | .apps[3].versionDate = $s_date | .apps[3].downloadURL = $s_url | .apps[3].size = ($s_size | tonumber)' \
             apps.json > apps.tmp.json && mv apps.tmp.json apps.json

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update apps index" && git push)
